name: Linux acceptance snapshot
on:
  push:
    branches: [codex/linux-acceptance-20261110-r1239]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and filesystem runtime dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libfuse2t64 rclone
          libxcb-cursor0 libarchive13t64 ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv linux/.venv
      - run: linux/.venv/bin/python -m pip install -r linux/requirements-dev.txt
      - name: Prepare checksum-verified pinned cloud test runtime
        run: linux/.venv/bin/python linux/tests/install_runtime.py >> "$GITHUB_PATH"
      - name: Record immutable source and runner
        run: |
          mkdir -p linux/build
          git rev-parse HEAD HEAD:linux > linux/build/source-tree.txt
          uname -a > linux/build/runner.txt
          cat /proc/meminfo >> linux/build/runner.txt
      - name: Run complete Linux suite
        shell: bash
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen linux/.venv/bin/python -m pytest linux/tests -q --junitxml=linux/build/pytest.xml | tee linux/build/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-acceptance-current-tree
          path: |
            linux/build/pytest.xml
            linux/build/pytest.log
            linux/build/source-tree.txt
            linux/build/runner.txt
